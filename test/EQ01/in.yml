subcases:
  A:
    users: 100
    posts_per_user: 1000
    communities: 50
    posts_per_community: 500
    tags: 100
    tags_per_post: 5

    # read
    followers_per_user: 10
    memberships_per_user: 15
  B:
    users: 250
    posts_per_user: 1000
    communities: 100
    posts_per_community: 1000
    tags: 250
    tags_per_post: 5

    # read
    followers_per_user: 25
    memberships_per_user: 10
  C:
    users: 500
    posts_per_user: 1000
    communities: 100
    posts_per_community: 2500
    tags: 500
    tags_per_post: 5

    # read
    followers_per_user: 50
    memberships_per_user: 25
seed: 0xDEADBEEF

cost:
  cf1:
    - { op: unload, c: 10, p: users, r: posts_per_user }
    - { op: load, c: 1, p: users, r: posts_per_user }
  cf2: 0
  cf3: 0
  cf4:
    - { op: unload, c: 10, p: communities, r: posts_per_community }
    - { op: load, c: 1, p: communities, r: posts_per_community }
  cf5: 0
  cf6:
    - { op: unload, c: 11, p: tags, r: posts_per_tag }
    - { op: load, c: 1, p: tags, r: posts_per_tag }
  cf7: 0
  cf8:
    - { op: unload, c: 11, p: posts, r: 1 }
    - { op: load, c: 1, p: posts, r: 1 }
  cf9: 0

read:
  tables:
    cf1: { w: 11 }
    cf2: { w: 9 }
    cf3: { w: 4 }
    cf4: { w: 11 }
    cf5: { w: 9 }
    cf6: { w: 12 }
    cf7: { w: 10 }
    cf8: { w: 12 }
    cf9: { w: 10 }
    F: { w: 6 }
    Mu: { w: 6 }
  queries:
    q01:
      f: 100
      plans:
        - F:
          cf1: { n_var: followers_per_user }
        - F:
          cf2: { n_var: followers_per_user }
          cf3: { n_var: followers_per_user, n: 100 }
    q02:
      f: 100
      plans:
        - Mu:
          cf4: { n_var: memberships_per_user }
        - Mu:
          cf5: { n_var: memberships_per_user }
          cf3: { n_var: memberships_per_user, n: 100 }
    q03:
      f: 100
      plans:
        - cf6:
        - cf7:
          cf3: { n: 100 }
    q13:
      f: 5
      plans:
        - cf8:
        - cf9:
          cf3:

results:
  qmin:
    plans: { q01: 2, q02: 2, q03: 2, q13: 2 }
  qbal:
    plans: { q01: 1, q02: 1, q03: 1, q13: 1 }
    data:
      cf1:
        - { group: init, table: pa, op: unload }
        - { group: qbal, table: cf1, op: load }
      cf4:
        - { group: init, table: pc, op: unload }
        - { group: qbal, table: cf4, op: load }
      cf6:
        - { group: init, table: pt, op: unload }
        - { group: qbal, table: cf6, op: load }
      cf8:
        - { group: init, table: p, op: unload }
        - { group: qbal, table: cf8, op: load }
  codevo:
    plans: { q01: 2, q02: 2, q03: 2, q13: 2 }
