subcases:
  A:
    users: 10_000
    communities: 100
    members_per_community: 1000
  B:
    users: 25_000
    communities: 200
    members_per_community: 1000
  C:
    users: 25_000
    communities: 250
    members_per_community: 2000
seed: 0xDEADBEEF

cost:
  cf1:
    - { op: unload, c: 6, p: users, r: memberships_per_user }
    - { op: load, c: 6, p: users, r: memberships_per_user }
  Mu: 0
  cf3:
    - { op: unload, c: 6, p: users, r: memberships_per_user }
    - { op: load, c: 6, p: users, r: memberships_per_user }

results:
  qmin:
    plans: { q04: 2 }
  qbal:
    plans: { q04: 1 }
    data:
      cf1:
        - { group: init, table: user_memberships, op: unload }
        - { group: qbal, table: cf1, op: load }
  codevo:
    plans: { q04: 2 }

read:
  tables:
    cf1: { w: 6 }
    Mu: { w: 6 }
    cf3: { w: 6 }
  queries:
    q04:
      f: 50
      plans:
        - cf1:
        - Mu:
          sort:
            - membership.role asc
        - cf3:
          sort:
            - membership.joinedAt desc
