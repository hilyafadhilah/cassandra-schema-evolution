subcases:
  A:
    users: 50_000
  B:
    users: 100_000
  C:
    users: 200_000
  D:
    users: 400_000
  E:
    users: 800_000
seed: 0xDEADBEEF

cost:
  cf1:
    - { op: unload, c: 7, p: users, r: 1 }
    - op: load
      c: 5
      p: users
      r: 1
      agg: [{ type: set, v: tags_per_post }]
  cf2:
    - { op: unload, c: 7, p: users, r: 1 }
    - { op: load, c: 1, p: users, r: 1 }
  cf3: 0
  cf4:
    - { op: unload, c: 7, p: users, r: 1 }
    - { op: load, c: 11, p: users, r: 1 }

results:
  qmin:
    plans: { q12: 2 }
    data:
      cf2:
        - { group: init, table: users, op: unload }
        - { group: qmin, table: users, op: load }
  qbal:
    plans: { q12: 1 }
    data:
      cf1:
        - { group: init, table: users, op: unload }
        - { group: qbal, table: users, op: load }
  codevo:
    plans: { q12: 3 }
    data:
      cf4:
        - { group: init, table: users, op: unload }
        - { group: codevo, table: cf4, op: load }

read:
  tables:
    cf1: { w: 13 }
    cf2: { w: 8 }
    cf3: { w: 11 }
    cf4: { w: 11 }
    U: { w: 7 }
    P: { w: 11 }
  queries:
    q12:
      f: 5
      plans:
        - cf1:
        - cf2:
          cf3:
        - cf4:
          U:
          P:
