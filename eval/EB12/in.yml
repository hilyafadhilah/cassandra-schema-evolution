read:
  tables:
    cf1: { w: 7 }
    cf2: { w: 4 }
    cf3: { w: 4 }
    cf4: { w: 4 }
    cf5: { w: 9 }
    cf6: { w: 8 }
    cf7: { w: 4 }
    cf8: { w: 8 }
    cf9: { w: 6 }
    cf10: { w: 6 }
    cf11: { w: 4 }
    cf12: { w: 7 }
    cf13: { w: 6 }
    cf14: { w: 3 }
    cf15: { w: 3 }
    cf16: { w: 1 }
    cf17: { w: 6 }
    cf18: { w: 3 }
    cf19: { w: 6 }
    cf20: { w: 4 }
    cf21: { w: 1 }
    m: { w: 9 }
  queries:
    q09:
      f: 50
      plans:
        - cf1:
        - cf2:
          C: { n_var: memberships_per_user }
    q10:
      f: 50
      plans:
        - cf10:
        - cf11:
          U: { n_var: members_per_community }
    q11:
      f: 50
      plans:
        - cf10:
        - cf11:
          U: { n_var: members_per_community }

results:
  qmin:
    plans: { q09: 2, q10: 2, q11: 2 }
    data:
      cf2:
        - { group: init, table: user_memberships, op: unload }
        - { group: qmin, table: cf2, op: load }
      cf11:
        - { group: init, table: community_members, op: unload }
        - { group: qmin, table: cf11, op: load }
  qbal:
    plans: { q09: 1, q10: 1, q11: 1 }
    data:
      cf1:
        - { group: init, table: user_memberships, op: unload }
        - { group: qbal, table: cf1, op: load }
      cf10:
        - { group: init, table: community_members, op: unload }
        - { group: qbal, table: cf10, op: load }
  alt:
    plans: { q09: 1, q10: 1, q11: 1 }
    data:
      cf8:
        - { group: init, table: user_memberships, op: unload }
        - { group: alt, table: cf8, op: load }
      cf21:
        - { group: init, table: community_members, op: unload }
        - { group: alt, table: cf21, op: load }
      m:
        - { group: alt, table: memberships, op: load }
